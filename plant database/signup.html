<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      min-height: 100vh;
      margin: 0;
    }

    .signup-image {
      flex: 1;
    }

    .signup-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .login-box {
      position: static;   /* cancels any absolute/fixed centering */
      transform: none;
      flex: 1;
      align-self: center;
      max-width: 420px;
      margin: 0 auto;
    }

    @media (max-width: 700px) {
      body { flex-direction: column; }
      .signup-image img { height: 200px; }
      .login-box { align-self: stretch; margin: 20px; }
    }
  </style>
</head>
<body>
  <div class="signup-image">
    <img src="images/pic8.jpeg" alt="Farm with a red barn">
  </div>
  <form class="login-box" id="signup-form">
    <h2>Create an account</h2>
    <input type="text" id="fullname" placeholder="Full name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="text" id="new-username" placeholder="Username" required>
    <input type="password" id="new-password" placeholder="Password" minlength="8" required>
    <button type="submit">Sign up</button>
    <p id="signup-message"></p>
    <a href="index.html" class="signup-btn">Back to login</a>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="signup.js"></script>
</body>
</html>
